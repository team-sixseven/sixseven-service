name: Deploy GCP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'inference/**'
      - 'compose.yaml'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require main
        run: test '${{ github.ref }}' = 'refs/heads/main'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.in pytest
      - run: PYTHONPATH=backend python -m pytest backend/tests tests -q
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker '${{ vars.GCP_REGION }}-docker.pkg.dev' --quiet
      - name: Build and publish
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          docker build -t "$REGISTRY/frontend:$GITHUB_SHA" frontend
          docker build -t "$REGISTRY/backend:$GITHUB_SHA" backend
          docker build -t "$REGISTRY/inference:$GITHUB_SHA" -f inference/Dockerfile .
          for service in frontend backend inference; do docker push "$REGISTRY/$service:$GITHUB_SHA"; done
      - name: Supply research dataset outside Git
        env:
          MUSIC_DATA_GZIP_BASE64: ${{ secrets.MUSIC_DATA_GZIP_BASE64 }}
          VM: ${{ vars.GCP_VM_NAME }}
          ZONE: ${{ vars.GCP_ZONE }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          if [ -z "$MUSIC_DATA_GZIP_BASE64" ]; then exit 0; fi
          dataset=$(mktemp)
          trap 'rm -f "$dataset"' EXIT
          printf '%s' "$MUSIC_DATA_GZIP_BASE64" | base64 -d | gzip -d > "$dataset"
          gcloud compute scp "$dataset" "$VM:/tmp/sixseven-music89.json" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet
          gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -e
          folder=$(docker volume inspect sixseven-service_backend-data --format '{{.Mountpoint}}')
          install -o 10001 -g 10001 -m 600 /tmp/sixseven-music89.json "$folder/music89.json"
          rm /tmp/sixseven-music89.json
          REMOTE
      - name: Deploy through IAP
        env:
          VM: ${{ vars.GCP_VM_NAME }}
          ZONE: ${{ vars.GCP_ZONE }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --command="sudo bash -c 'cd /opt/sixseven-service && git fetch origin main && git checkout --detach $GITHUB_SHA && ./deploy/update.sh $GITHUB_SHA'"
