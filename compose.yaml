name: sixseven-service

services:
  backend:
    build: ./backend
    init: true
    environment:
      SQLITE_PATH: /app/data/service.sqlite3
    volumes:
      - backend-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true

volumes:
  backend-data:
