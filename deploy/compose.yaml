# Used together with the root compose.yaml after CI publishes immutable images.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    environment:
      ISOLATED_DEMO: "true"
      MUSIC_DATA_PATH: /app/data/music89.json
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-true}"
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
  inference:
    image: ${INFERENCE_IMAGE:?Set INFERENCE_IMAGE}
